<div id="main">

<script>

/* =========================================================
   DOM
========================================================= */

const list =
document.getElementById("list");

const grid =
document.getElementById("grid");

const container =
document.getElementById("container");

const spacer =
document.getElementById("spacer");

const searchBox =
document.getElementById("searchBox");

const blockStatus =
document.getElementById("blockStatus");

const loader =
document.getElementById("fontLoader");


/* =========================================================
   Unicode Blocks
   Unicode 17.0.0 official Blocks.txt
========================================================= */

const BLOCKS_URL =
"https://www.unicode.org/Public/17.0.0/ucd/Blocks.txt";

let blocks = [];


/* =========================================================
   状態
========================================================= */

let favoriteMode = false;

let allUnicodeMode = false;

let start = 0;

let end = 0;

let cols = 6;

let lastVisibleRow = -1;

let ticking = false;

let searchMode = false;


/* =========================================================
   仮想スクロール設定
========================================================= */

const CELL_H = 95;

/*
  一度に生成する行数。

  60行 × 列数程度なので、
  Unicode全体でもDOMが巨大化しません。
*/
const ROWS = 60;


/* =========================================================
   お気に入り
========================================================= */

let favorites =
JSON.parse(
  localStorage.getItem("unicodeFav") || "[]"
);


/* =========================================================
   お気に入り保存
========================================================= */

function saveFav(){

  localStorage.setItem(
    "unicodeFav",
    JSON.stringify(favorites)
  );

}


/* =========================================================
   お気に入り切替
========================================================= */

function toggleFavorite(code, starEl){

  const exists =
    favorites.includes(code);

  if(exists){

    favorites =
      favorites.filter(
        v => v !== code
      );

    if(starEl){

      starEl.classList.remove(
        "active"
      );

    }

  }else{

    favorites.unshift(code);

    if(starEl){

      starEl.classList.add(
        "active"
      );

    }

  }

  saveFav();

  if(favoriteMode){

    showFavorites();

  }

}


/* =========================================================
   お気に入り表示
========================================================= */

function showFavorites(){

  favoriteMode = true;

  allUnicodeMode = false;

  searchMode = false;

  grid.innerHTML = "";

  grid.style.top = "0px";

  spacer.style.height = "0px";

  container.scrollTop = 0;

  favorites.forEach(code=>{

    createCell(
      code,
      grid
    );

  });

}


/* =========================================================
   全Unicode表示
========================================================= */

function showAllUnicode(){

  favoriteMode = false;

  allUnicodeMode = true;

  searchMode = false;

  start = 0x000000;

  end = 0x10FFFF;

  container.scrollTop = 0;

  lastVisibleRow = -1;

  grid.innerHTML = "";

  grid.style.top = "0px";

  updateSpacer();

  render();

}


/* =========================================================
   列数計算
========================================================= */

function updateCols(){

  const width =
    grid.offsetWidth;

  cols =
    Math.max(
      1,
      Math.floor(width / 86)
    );

}


/* =========================================================
   ブロック一覧を作成
========================================================= */

function renderBlockList(){

  list.innerHTML = "";

  blocks.forEach(block=>{

    const div =
      document.createElement("div");

    div.className = "block";

    div.textContent =
      block.name;

    div.title =
      "U+" +
      block.start
        .toString(16)
        .toUpperCase()
        .padStart(4,"0") +
      "..U+" +
      block.end
        .toString(16)
        .toUpperCase()
        .padStart(4,"0");

    div.onclick = ()=>{

      loadBlock(
        block.start,
        block.end
      );

    };

    list.appendChild(div);

  });

}


/* =========================================================
   Unicode公式Blocks.txtを読み込む
========================================================= */

async function loadUnicodeBlocks(){

  try{

    const response =
      await fetch(
        BLOCKS_URL,
        {
          cache:"force-cache"
        }
      );

    if(!response.ok){

      throw new Error(
        "Blocks.txt HTTP " +
        response.status
      );

    }

    const text =
      await response.text();

    blocks = [];

    const lines =
      text.split(/\r?\n/);

    for(const line of lines){

      /*
        コメント・空行を除外
      */

      const trimmed =
        line.trim();

      if(
        !trimmed ||
        trimmed.startsWith("#")
      ){

        continue;

      }

      const parts =
        trimmed.split(";");

      if(parts.length < 2){

        continue;

      }

      const range =
        parts[0].trim();

      const name =
        parts[1].trim();

      const rangeParts =
        range.split("..");

      if(rangeParts.length !== 2){

        continue;

      }

      const blockStart =
        parseInt(
          rangeParts[0],
          16
        );

      const blockEnd =
        parseInt(
          rangeParts[1],
          16
        );

      if(
        Number.isNaN(blockStart) ||
        Number.isNaN(blockEnd)
      ){

        continue;

      }

      blocks.push({

        name:name,

        start:blockStart,

        end:blockEnd

      });

    }

    renderBlockList();

    blockStatus.textContent =
      "Unicode 17.0.0 / " +
      blocks.length +
      "ブロック";

    /*
      初期表示
    */

    loadBlock(
      0x3040,
      0x309F
    );

  }catch(error){

    console.error(
      "Unicode Blocks読み込みエラー:",
      error
    );

    /*
      通信失敗時にもビューアを止めない
    */

    blockStatus.textContent =
      "ブロック一覧を読み込めませんでした";

    /*
      最低限のフォールバック
    */

    blocks = [

      {
        name:"Basic Latin",
        start:0x0000,
        end:0x007F
      },

      {
        name:"Hiragana",
        start:0x3040,
        end:0x309F
      },

      {
        name:"Katakana",
        start:0x30A0,
        end:0x30FF
      },

      {
        name:"CJK Unified Ideographs",
        start:0x4E00,
        end:0x9FFF
      },

      {
        name:"Emoji",
        start:0x1F300,
        end:0x1FAFF
      }

    ];

    renderBlockList();

    loadBlock(
      0x3040,
      0x309F
    );

  }

}


/* =========================================================
   ブロック読み込み
========================================================= */

function loadBlock(blockStart, blockEnd){

  favoriteMode = false;

  allUnicodeMode = false;

  searchMode = false;

  start = blockStart;

  end = blockEnd;

  container.scrollTop = 0;

  lastVisibleRow = -1;

  grid.innerHTML = "";

  grid.style.top = "0px";

  updateSpacer();

  render();

}


/* =========================================================
   スペーサー
========================================================= */

function updateSpacer(){

  updateCols();

  /*
    +1 が重要。
    例:
    3040..309F
    → 96文字
  */

  const total =
    end - start + 1;

  const totalRows =
    Math.ceil(
      total / cols
    );

  spacer.style.height =
    (totalRows * CELL_H) +
    "px";

}


/* =========================================================
   仮想スクロール
========================================================= */

function render(){

  if(searchMode){

    ticking = false;

    return;

  }

  const scrollTop =
    container.scrollTop;

  const visibleRow =
    Math.floor(
      scrollTop / CELL_H
    );

  const rowStart =
    Math.max(
      0,
      visibleRow - 20
    );

  if(
    visibleRow === lastVisibleRow
  ){

    ticking = false;

    return;

  }

  lastVisibleRow =
    visibleRow;

  updateCols();

  const fragment =
    document.createDocumentFragment();

  /*
    表示する最大行
  */

  for(
    let r = 0;
    r < ROWS;
    r++
  ){

    for(
      let c = 0;
      c < cols;
      c++
    ){

      const code =
        start +
        ((rowStart + r) * cols) +
        c;

      if(code > end){

        continue;

      }

      const cell =
        createCellElement(
          code
        );

      if(cell){

        fragment.appendChild(
          cell
        );

      }

    }

  }

  grid.innerHTML = "";

  grid.appendChild(
    fragment
  );

  grid.style.top =
    (rowStart * CELL_H) +
    "px";

  ticking = false;

}


/* =========================================================
   Unicodeコードポイント判定
========================================================= */

function isValidCodePoint(code){

  /*
    Unicodeの最大値
  */

  if(
    code < 0 ||
    code > 0x10FFFF
  ){

    return false;

  }

  /*
    UTF-16 Surrogate
    D800-DFFF

    これは通常のUnicode文字として
    単独表示するものではありません。
  */

  if(
    code >= 0xD800 &&
    code <= 0xDFFF
  ){

    return false;

  }

  return true;

}


/* =========================================================
   セル生成
========================================================= */

function createCellElement(code){

  if(
    !isValidCodePoint(code)
  ){

    return null;

  }

  try{

    const ch =
      String.fromCodePoint(
        code
      );

    const div =
      document.createElement("div");

    div.className =
      "cell";

    /*
      お気に入り状態
    */

    const active =
      favorites.includes(code);

    div.innerHTML = `

      <div class="star ${
        active ? "active" : ""
      }">
        ★
      </div>

      <div class="char"></div>

      <div class="code">
        U+${code
          .toString(16)
          .toUpperCase()
          .padStart(4,"0")}
      </div>

    `;

    /*
      textContentを使うことで、
      Unicode文字によるHTML解釈を防ぐ
    */

    const char =
      div.querySelector(
        ".char"
      );

    char.textContent =
      ch;

    /*
      セル本体
    */

    div.onclick = ()=>{

      copy(ch);

    };

    /*
      星
    */

    const star =
      div.querySelector(
        ".star"
      );

    star.onclick = (e)=>{

      e.stopPropagation();

      toggleFavorite(
        code,
        star
      );

    };

    return div;

  }catch(error){

    return null;

  }

}


/* =========================================================
   セル追加
========================================================= */

function createCell(
  code,
  target
){

  const el =
    createCellElement(
      code
    );

  if(el){

    target.appendChild(
      el
    );

  }

}


/* =========================================================
   コピー
========================================================= */

async function copy(char){

  try{

    await navigator.clipboard.writeText(
      char
    );

  }catch{

    /*
      Safari等でClipboard APIが
      使用できない場合のフォールバック
    */

    const textarea =
      document.createElement(
        "textarea"
      );

    textarea.value =
      char;

    textarea.style.position =
      "fixed";

    textarea.style.opacity =
      "0";

    document.body.appendChild(
      textarea
    );

    textarea.select();

    try{

      document.execCommand(
        "copy"
      );

    }catch(e){}

    textarea.remove();

  }

  const toast =
    document.getElementById(
      "toast"
    );

  toast.style.opacity = "1";

  setTimeout(()=>{

    toast.style.opacity = "0";

  },1000);

}


/* =========================================================
   検索
========================================================= */

searchBox.addEventListener(
  "input",
  ()=>{

    favoriteMode = false;

    allUnicodeMode = false;

    const q =
      searchBox.value.trim();

    /*
      検索欄が空
    */

    if(!q){

      searchMode = false;

      lastVisibleRow = -1;

      grid.innerHTML = "";

      grid.style.top = "0px";

      updateSpacer();

      render();

      return;

    }

    searchMode = true;

    grid.innerHTML = "";

    grid.style.top = "0px";

    spacer.style.height =
      "0px";

    /*
      U+3042
      3042
      1F600
      10FFFF
    */

    const unicodePattern =
      /^(U\+)?[0-9A-Fa-f]{2,6}$/;

    if(
      unicodePattern.test(q)
    ){

      const hex =
        q.replace(
          /^U\+/i,
          ""
        );

      const code =
        parseInt(
          hex,
          16
        );

      if(
        !Number.isNaN(code) &&
        code <= 0x10FFFF
      ){

        if(
          isValidCodePoint(code)
        ){

          createCell(
            code,
            grid
          );

        }

      }

      return;

    }

    /*
      普通の文字検索

      例:
      あいう
      😀
      A
    */

    for(
      const ch of q
    ){

      const code =
        ch.codePointAt(0);

      createCell(
        code,
        grid
      );

    }

  }
);


/* =========================================================
   スクロール
========================================================= */

container.addEventListener(
  "scroll",
  ()=>{

    if(
      favoriteMode ||
      searchMode
    ){

      return;

    }

    if(!ticking){

      ticking = true;

      requestAnimationFrame(
        render
      );

    }

  },
  {
    passive:true
  }
);


/* =========================================================
   リサイズ
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    if(
      favoriteMode ||
      searchMode
    ){

      return;

    }

    lastVisibleRow = -1;

    updateSpacer();

    render();

  }
);


/* =========================================================
   ローディング終了
========================================================= */

function hideLoader(){

  if(!loader){

    return;

  }

  loader.style.opacity =
    "0";

  loader.style.pointerEvents =
    "none";

  setTimeout(()=>{

    if(loader){

      loader.remove();

    }

  },400);

}


/* =========================================================
   起動
========================================================= */

/*
  フォントの読み込み完了は
  一切待たない。

  Unicode Viewer自体を先に起動する。
*/

loadUnicodeBlocks();

/*
  念のため最大2秒で
  ローディングを強制終了。
*/

setTimeout(()=>{

  hideLoader();

},2000);


/*
  loadイベントでも閉じる。
*/

window.addEventListener(
  "load",
  ()=>{

    hideLoader();

  }
);

</script>
